<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>keaidang.com · 部署测试页</title>
  <meta name="description" content="keaidang.com 个人博客部署测试页 — EdgeOne Pages">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✍️</text></svg>">
  <style>
    :root {
      --bg: #0d0f14;
      --panel: #171b25;
      --border: #262c3b;
      --text: #e8eaf0;
      --dim: #9aa1b2;
      --accent: #4f8ef7;
      --ok: #3ecf8e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: grid; place-items: center;
      line-height: 1.7; padding: 24px;
    }
    .card {
      width: min(620px, 100%);
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 16px; padding: 44px 40px; text-align: center;
    }
    .badge {
      display: inline-block; padding: 4px 14px; border-radius: 999px;
      font-size: .8rem; font-weight: 600; margin-bottom: 22px;
      background: rgba(62, 207, 142, .12); color: var(--ok);
    }
    h1 { font-size: 1.9rem; margin-bottom: 8px; }
    h1 span { color: var(--accent); }
    .sub { color: var(--dim); margin-bottom: 30px; }
    .rows { text-align: left; margin-bottom: 30px; }
    .row {
      display: flex; justify-content: space-between; gap: 16px;
      padding: 11px 16px; border: 1px solid var(--border);
      border-radius: 10px; margin-bottom: 8px; font-size: .9rem;
    }
    .row .k { color: var(--dim); }
    .row .v { font-weight: 600; }
    code {
      font-family: Consolas, monospace; font-size: .82rem;
      background: rgba(255,255,255,.06); padding: 2px 8px; border-radius: 6px;
    }
    .next { color: var(--dim); font-size: .85rem; }
    .next strong { color: var(--text); }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">● 部署成功 · EdgeOne Pages 测试中</span>
    <h1>keaidang<span>.com</span></h1>
    <p class="sub">个人博客 · 主域名部署测试页</p>
    <div class="rows">
      <div class="row"><span class="k">域名</span><span class="v">keaidang.com（博客主站）</span></div>
      <div class="row"><span class="k">托管</span><span class="v">腾讯云 EdgeOne Pages</span></div>
      <div class="row"><span class="k">代码仓库</span><span class="v">github.com/keaidang/keaidang-blog</span></div>
      <div class="row"><span class="k">构建方式</span><span class="v">静态页面（无构建）</span></div>
      <div class="row"><span class="k">后续计划</span><span class="v"><code>Astro</code> 博客框架迁移</span></div>
      <div class="row"><span class="k">关联服务</span><span class="v">@keaidang.com 邮箱（不受影响）</span></div>
    </div>
    <p class="next">
      看到这个页面 = <strong>域名解析 + HTTPS + 部署链路全部打通</strong> ✅<br>
      下一步：Astro 博客正式搭建
    </p>
  </main>
</body>
</html>
